<div class="hk-wrap"><div class="hk-card" id="join">
  <h1>Join the waitlist</h1>
  <p>Website audits are paused while we move SiteCheck to new hosting. Leave your email and we'll let you know the moment the app is back.</p>
  <form class="hk-form" id="hk-f" novalidate>
    <input type="email" name="email" placeholder="you@company.com" autocomplete="email" required aria-label="Email address">
    <input class="hk-hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="hk-btn" type="submit">Join waitlist</button>
  </form>
  <div class="hk-msg" id="hk-m" aria-live="polite"></div>
</div></div>
<script>
(function(){
  var f=document.getElementById('hk-f'),m=document.getElementById('hk-m');
  f.addEventListener('submit',async function(e){
    e.preventDefault();var email=f.email.value.trim();m.className='hk-msg';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){m.className='hk-msg err';m.textContent='Please enter a valid email address.';return;}
    var b=f.querySelector('button');b.disabled=true;b.textContent='Joining…';
    try{var r=await fetch('/waitlist',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:email,company:f.company.value,source:location.pathname+location.search})});
      if(!r.ok)throw 0;m.className='hk-msg ok';m.textContent="You're on the list. We'll email you when we're back.";f.reset();}
    catch(_){m.className='hk-msg err';m.textContent='Something went wrong. Please try again.';}
    finally{b.disabled=false;b.textContent='Join waitlist';}
  });
})();
</script>
